{{- if .Values.ingress.enabled -}}
{{- $fullName := include "meet.fullname" . -}}

{{- /* Centralize kube version checks */ -}}
{{- $gitVersion := .Capabilities.KubeVersion.GitVersion -}}
{{- $isV19 := semverCompare ">=1.19-0" $gitVersion -}}
{{- $isV18 := semverCompare ">=1.18-0" $gitVersion -}}
{{- $isV14 := semverCompare ">=1.14-0" $gitVersion -}}

{{- /* Select ingress apiVersion once */ -}}
{{- $ingressApiVersion := "extensions/v1beta1" -}}
{{- if $isV19 -}}
{{- $ingressApiVersion = "networking.k8s.io/v1" -}}
{{- else if $isV14 -}}
{{- $ingressApiVersion = "networking.k8s.io/v1beta1" -}}
{{- end -}}

{{- if and .Values.ingress.className (not $isV18) }}
  {{- if not (hasKey .Values.ingress.annotations "kubernetes.io/ingress.class") }}
  {{- $_ := set .Values.ingress.annotations "kubernetes.io/ingress.class" .Values.ingress.className }}
  {{- end }}
{{- end }}

apiVersion: {{ $ingressApiVersion }}
kind: Ingress
metadata:
  name: {{ $fullName }}
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "meet.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
  {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if and .Values.ingress.className $isV18 }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}

  {{- if .Values.ingress.tls.enabled }}
  tls:
    {{- if .Values.ingress.host }}
    - secretName: {{ .Values.ingress.tls.secretName | default (printf "%s-tls" $fullName) | quote }}
      hosts:
        - {{ .Values.ingress.host | quote }}
    {{- end }}
    {{- range .Values.ingress.tls.additional }}
    - hosts:
        {{- range .hosts }}
        - {{ . | quote }}
        {{- end }}
      secretName: {{ .secretName }}
    {{- end }}
  {{- end }}

  rules:
    {{- if .Values.ingress.host }}
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: {{ .Values.ingress.path | quote }}
            {{- if $isV18 }}
            pathType: Prefix
            {{- end }}
            backend:
              {{- if $isV19 }}
              service:
                name: {{ include "meet.frontend.fullname" . }}
                port:
                  number: {{ .Values.frontend.service.port }}
              {{- else }}
              serviceName: {{ include "meet.frontend.fullname" . }}
              servicePort: {{ .Values.frontend.service.port }}
              {{- end }}

          - path: /api/
            {{- if $isV18 }}
            pathType: Prefix
            {{- end }}
            backend:
              {{- if $isV19 }}
              service:
                name: {{ include "meet.backend.fullname" . }}
                port:
                  number: {{ .Values.backend.service.port }}
              {{- else }}
              serviceName: {{ include "meet.backend.fullname" . }}
              servicePort: {{ .Values.backend.service.port }}
              {{- end }}

          - path: /external-api/
            {{- if $isV18 }}
            pathType: Prefix
            {{- end }}
            backend:
              {{- if $isV19 }}
              service:
                name: {{ include "meet.backend.fullname" . }}
                port:
                  number: {{ .Values.backend.service.port }}
              {{- else }}
              serviceName: {{ include "meet.backend.fullname" . }}
              servicePort: {{ .Values.backend.service.port }}
              {{- end }}

          {{- with .Values.ingress.customBackends }}
            {{- toYaml . | nindent 10 }}
          {{- end }}
    {{- end }}

    {{- range .Values.ingress.hosts }}
    - host: {{ . | quote }}
      http:
        paths:
          - path: {{ $.Values.ingress.path | quote }}
            {{- if $isV18 }}
            pathType: Prefix
            {{- end }}
            backend:
              {{- if $isV19 }}
              service:
                name: {{ include "meet.frontend.fullname" $ }}
                port:
                  number: {{ $.Values.frontend.service.port }}
              {{- else }}
              serviceName: {{ include "meet.frontend.fullname" $ }}
              servicePort: {{ $.Values.frontend.service.port }}
              {{- end }}

          - path: /api/
            {{- if $isV18 }}
            pathType: Prefix
            {{- end }}
            backend:
              {{- if $isV19 }}
              service:
                name: {{ include "meet.backend.fullname" $ }}
                port:
                  number: {{ $.Values.backend.service.port }}
              {{- else }}
              serviceName: {{ include "meet.backend.fullname" $ }}
              servicePort: {{ $.Values.backend.service.port }}
              {{- end }}

          - path: /external-api/
            {{- if $isV18 }}
            pathType: Prefix
            {{- end }}
            backend:
              {{- if $isV19 }}
              service:
                name: {{ include "meet.backend.fullname" $ }}
                port:
                  number: {{ $.Values.backend.service.port }}
              {{- else }}
              serviceName: {{ include "meet.backend.fullname" $ }}
              servicePort: {{ $.Values.backend.service.port }}
              {{- end }}

          {{- with $.Values.ingress.customBackends }}
            {{- toYaml . | nindent 10 }}
          {{- end }}
    {{- end }}
{{- end }}
